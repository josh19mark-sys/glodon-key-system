<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glodon Hub</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#eee;
  font-family:Arial,sans-serif;
  min-height:100vh;
}
.page{
  display:none;
  min-height:100vh;
  padding:28px 20px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}
.page.active{display:flex}
h1{color:#d9b65d;font-size:27px}
button{
  background:#111;
  color:#e1c36c;
  border:1px solid #8d7137;
  border-radius:10px;
  padding:13px 20px;
  margin:9px 0;
  width:100%;
  max-width:300px;
  font-size:15px;
  cursor:pointer;
}
button:disabled{opacity:.35;cursor:not-allowed}
a{color:#38a5ff;overflow-wrap:anywhere}
.card{
  width:100%;
  max-width:360px;
  padding:22px;
  background:#050505;
  border:1px solid #292929;
  border-radius:15px;
}
.status{color:#aaa;font-size:14px;line-height:1.6}
#helpPage{background:#000}
.help-line{font-size:18px;line-height:1.8}
#keyOutput{
  padding:13px;
  margin:14px 0;
  border:1px solid #333;
  border-radius:8px;
  overflow-wrap:anywhere;
  color:#e1c36c;
}
</style>
</head>
<body>

<section class="page active" id="mainPage">
  <div class="card">
    <h1>GLODON HUB</h1>
    <p class="status">Completa los pasos para continuar.</p>

    <button id="task1">TASK 1 — YOUTUBE</button>
    <p class="status" id="timer1"></p>

    <button id="task2" disabled>TASK 2 — DISCORD</button>
    <p class="status" id="timer2"></p>

    <button id="task3" disabled>TASK 3 — AYUDA</button>
  </div>
</section>

<section class="page" id="helpPage">
  <div class="card">
    <p class="help-line">
      Ayuda:
      <a href="https://youtube.com/shorts/9S5jkNaBL1I?si=6HN8ckN-EKfj14Dr"
         target="_blank" rel="noopener noreferrer">
        https://youtube.com/shorts/9S5jkNaBL1I?si=6HN8ckN-EKfj14Dr
      </a>
    </p>
    <button id="continueButton">CONTINUAR</button>
    <button id="backButton">VOLVER</button>
  </div>
</section>

<section class="page" id="generatorPage">
  <div class="card">
    <h1>GLODON HUB</h1>
    <p class="status">Generador de Key</p>
    <button id="generateButton">GENERAR KEY</button>
    <div id="keyOutput">Aquí aparecerá tu Key.</div>
    <p class="status" id="expiry"></p>
    <button id="copyButton" disabled>COPIAR KEY</button>
    <p class="status" id="message"></p>
    <button id="generatorBack">VOLVER</button>
  </div>
</section>

<script>
(() => {
  const pages = {
    main: document.getElementById("mainPage"),
    help: document.getElementById("helpPage"),
    generator: document.getElementById("generatorPage")
  };

  let currentPage = "main";
  let keyValue = "";
  let expiryTime = 0;
  let expiryInterval = null;
  let task1Done = false;
  let task2Done = false;

  // Mantiene la navegación dentro de la web.
  history.replaceState({page:"main"}, "", location.href);
  history.pushState({page:"main"}, "", "#main");

  function showPage(name, addHistory = true) {
    if (!pages[name]) name = "main";
    currentPage = name;

    Object.values(pages).forEach(page => page.classList.remove("active"));
    pages[name].classList.add("active");

    if (addHistory) {
      history.pushState({page:name}, "", "#" + name);
    }
  }

  window.addEventListener("popstate", event => {
    const target = event.state && event.state.page;
    if (target && pages[target]) {
      showPage(target, false);
    } else {
      showPage("main", false);
      history.pushState({page:"main"}, "", "#main");
    }
  });

  document.getElementById("task1").addEventListener("click", () => {
    window.open(
      "https://youtube.com/shorts/2B3r12H67_Y?si=i0cSfdBKIt0Vmzg7",
      "_blank",
      "noopener,noreferrer"
    );

    if (task1Done) return;

    let seconds = 20;
    const label = document.getElementById("timer1");
    document.getElementById("task1").disabled = true;
    label.textContent = "Espera " + seconds + " segundos...";

    const timer = setInterval(() => {
      seconds--;
      label.textContent = seconds > 0
        ? "Espera " + seconds + " segundos..."
        : "Paso completado.";

      if (seconds <= 0) {
        clearInterval(timer);
        task1Done = true;
        document.getElementById("task1").disabled = false;
        document.getElementById("task2").disabled = false;
      }
    }, 1000);
  });

  document.getElementById("task2").addEventListener("click", () => {
    window.open(
      "https://discord.gg/jEQGF6zWS",
      "_blank",
      "noopener,noreferrer"
    );

    if (task2Done) return;

    let seconds = 10;
    const label = document.getElementById("timer2");
    document.getElementById("task2").disabled = true;
    label.textContent = "Espera " + seconds + " segundos...";

    const timer = setInterval(() => {
      seconds--;
      label.textContent = seconds > 0
        ? "Espera " + seconds + " segundos..."
        : "Paso completado.";

      if (seconds <= 0) {
        clearInterval(timer);
        task2Done = true;
        document.getElementById("task2").disabled = false;
        document.getElementById("task3").disabled = false;
      }
    }, 1000);
  });

  // TASK 3 abre una pantalla negra con SOLO el enlace de Ayuda.
  document.getElementById("task3").addEventListener("click", () => {
    showPage("help");
  });

  document.getElementById("backButton").addEventListener("click", () => {
    showPage("main");
  });

  document.getElementById("continueButton").addEventListener("click", () => {
    showPage("generator");
  });

  document.getElementById("generatorBack").addEventListener("click", () => {
    showPage("main");
  });

  document.getElementById("generateButton").addEventListener("click", async () => {
    const button = document.getElementById("generateButton");
    const output = document.getElementById("keyOutput");
    const message = document.getElementById("message");
    const copyButton = document.getElementById("copyButton");

    button.disabled = true;
    output.textContent = "Generando...";
    message.textContent = "";
    copyButton.disabled = true;
    keyValue = "";

    try {
      const response = await fetch(
        "https://glodon-key-system.onrender.com/api/keys/create",
        {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({})
        }
      );

      const data = await response.json();

      if (!response.ok || !data.key) {
        throw new Error(data.error || "No se pudo generar la Key.");
      }

      keyValue = data.key;
      output.textContent = keyValue;
      expiryTime = new Date(data.expiresAt).getTime();

      if (expiryInterval) clearInterval(expiryInterval);

      function updateExpiry() {
        const remaining = expiryTime - Date.now();

        if (!Number.isFinite(expiryTime) || remaining <= 0) {
          document.getElementById("expiry").textContent =
            "La Key ha expirado.";
          clearInterval(expiryInterval);
          copyButton.disabled = true;
          return;
        }

        const hours = Math.floor(remaining / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        document.getElementById("expiry").textContent =
          "Expira en: " + hours + "h " + minutes + "m " + seconds + "s";
      }

      updateExpiry();
      expiryInterval = setInterval(updateExpiry, 1000);
      copyButton.disabled = false;
      message.textContent = "Key generada correctamente.";
    } catch (error) {
      output.textContent = "No se pudo generar la Key.";
      message.textContent = error.message || "Comprueba tu conexión e inténtalo de nuevo.";
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("copyButton").addEventListener("click", async () => {
    const message = document.getElementById("message");

    if (!keyValue || Date.now() >= expiryTime) {
      message.textContent = "La Key no está disponible o ha expirado.";
      return;
    }

    try {
      await navigator.clipboard.writeText(keyValue);
      message.textContent = "Key copiada correctamente.";
    } catch {
      const area = document.createElement("textarea");
      area.value = keyValue;
      area.style.position = "fixed";
      area.style.left = "-9999px";
      document.body.appendChild(area);
      area.select();

      const copied = document.execCommand("copy");
      area.remove();

      message.textContent = copied
        ? "Key copiada correctamente."
        : "No se pudo copiar automáticamente. Mantén pulsada la Key para copiarla.";
    }
  });
})();
</script>
</body>
</html>
