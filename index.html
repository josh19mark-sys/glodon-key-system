<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glodon Hub — Key System</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #000;
  color: #eee;
  font-family: Arial, sans-serif;
}

.page {
  display: none;
  min-height: 100vh;
  padding: 22px;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
}

.page.active {
  display: flex;
}

.card {
  width: 100%;
  max-width: 360px;
  padding: 22px;
  background: #050505;
  border: 1px solid #292929;
  border-radius: 15px;
}

h1 {
  color: #d9b65d;
  font-size: 27px;
  margin: 10px 0 18px;
}

.status {
  color: #aaa;
  font-size: 14px;
  line-height: 1.6;
  overflow-wrap: anywhere;
}

button {
  display: block;
  width: 100%;
  max-width: 300px;
  margin: 10px auto;
  padding: 13px 16px;
  background: #101010;
  color: #e1c36c;
  border: 1px solid #8d7137;
  border-radius: 9px;
  font-size: 14px;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

#helpIcon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 35px;
  height: 35px;
  padding: 0;
  margin: 0 0 12px auto;
  border: 1px solid #c5a34e;
  border-radius: 50%;
  background: #090909;
  color: #e4c46a;
  font-size: 23px;
}

#keyOutput {
  padding: 13px;
  margin: 14px 0;
  border: 1px solid #333;
  border-radius: 8px;
  color: #e1c36c;
  overflow-wrap: anywhere;
  user-select: text;
}

.help-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, .88);
}

.help-overlay[hidden] {
  display: none;
}

.help-box {
  position: relative;
  width: 100%;
  max-width: 340px;
  padding: 30px 20px 22px;
  background: #080808;
  border: 1px solid #9b7b35;
  border-radius: 14px;
  color: #eee;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.help-box a {
  color: #39a5ff;
  text-decoration: underline;
}

.close-help {
  position: absolute;
  top: 5px;
  right: 7px;
  width: 35px;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 27px;
}

.help-box p {
  margin-top: 12px;
}
</style>
</head>

<body>

<!-- PANTALLA PRINCIPAL -->
<section class="page active" id="mainPage">
  <div class="card">
    <h1>GLODON HUB</h1>
    <p class="status">Completa los pasos para continuar.</p>

    <button id="task1">TASK 1 — YOUTUBE</button>
    <p class="status" id="timer1"></p>

    <button id="task2" disabled>TASK 2 — DISCORD</button>
    <p class="status" id="timer2"></p>
  </div>
</section>

<!-- KEY SYSTEM -->
<section class="page" id="generatorPage">
  <div class="card">

    <button id="helpIcon" aria-label="Ayuda" title="Ayuda">¡</button>

    <h1>GLODON HUB</h1>
    <p class="status">Generador de Key</p>

    <button id="generateButton">GENERAR KEY</button>

    <div id="keyOutput">Aquí aparecerá tu Key.</div>

    <p class="status" id="expiry"></p>

    <button id="copyButton" disabled>COPIAR KEY</button>

    <p class="status" id="message"></p>

    <button id="generatorBack">VOLVER</button>
  </div>
</section>

<!-- VENTANA DE AYUDA -->
<div id="helpOverlay" class="help-overlay" hidden>
  <div class="help-box">
    <button id="closeHelp" class="close-help" aria-label="Cerrar">×</button>

    <p>Sí necesitas ayuda mira este video:</p>

    <a
      href="https://youtube.com/shorts/9S5jkNaBL1I?si=6HN8ckN-EKfj14Dr"
      target="_blank"
      rel="noopener noreferrer">
      https://youtube.com/shorts/9S5jkNaBL1I?si=6HN8ckN-EKfj14Dr
    </a>
  </div>
</div>

<script>
(() => {
  "use strict";

  const mainPage = document.getElementById("mainPage");
  const generatorPage = document.getElementById("generatorPage");
  const helpOverlay = document.getElementById("helpOverlay");

  const task1Button = document.getElementById("task1");
  const task2Button = document.getElementById("task2");
  const timer1 = document.getElementById("timer1");
  const timer2 = document.getElementById("timer2");

  const helpIcon = document.getElementById("helpIcon");
  const closeHelp = document.getElementById("closeHelp");

  const generateButton = document.getElementById("generateButton");
  const keyOutput = document.getElementById("keyOutput");
  const expiryLabel = document.getElementById("expiry");
  const copyButton = document.getElementById("copyButton");
  const message = document.getElementById("message");

  let task1Done = false;
  let task2Done = false;
  let keyValue = "";
  let expiryTime = 0;
  let expiryInterval = null;
  let currentPage = "main";
  let task1Timer = null;
  let task2Timer = null;

  /*
   * Navegación interna:
   * el botón de retroceso vuelve a la pantalla anterior
   * en lugar de abandonar inmediatamente la web.
   */
  function renderPage(page) {
    currentPage = page;

    mainPage.classList.toggle("active", page === "main");
    generatorPage.classList.toggle("active", page === "generator");

    if (page !== "generator") {
      helpOverlay.hidden = true;
    }
  }

  function navigate(page) {
    if (page !== "main" && page !== "generator") return;

    if (currentPage === page) return;

    history.pushState({ glodonPage: page }, "", "#" + page);
    renderPage(page);
  }

  history.replaceState({ glodonPage: "main" }, "", location.pathname + location.search);
  renderPage("main");

  window.addEventListener("popstate", event => {
    const page = event.state && event.state.glodonPage;

    if (helpOverlay.hidden === false) {
      helpOverlay.hidden = true;
      history.pushState(
        { glodonPage: currentPage },
        "",
        "#" + currentPage
      );
      return;
    }

    if (page === "main" || page === "generator") {
      renderPage(page);
    } else {
      renderPage("main");
      history.pushState({ glodonPage: "main" }, "", "#main");
    }
  });

  /*
   * TASK 1: abrir YouTube y esperar 20 segundos.
   */
  task1Button.addEventListener("click", () => {
    if (task1Done) return;

    window.open(
      "https://youtube.com/shorts/2B3r12H67_Y?si=i0cSfdBKIt0Vmzg7",
      "_blank",
      "noopener,noreferrer"
    );

    task1Button.disabled = true;
    let seconds = 20;

    timer1.textContent = "Espera " + seconds + " segundos...";

    task1Timer = setInterval(() => {
      seconds--;

      timer1.textContent = seconds > 0
        ? "Espera " + seconds + " segundos..."
        : "Paso completado.";

      if (seconds <= 0) {
        clearInterval(task1Timer);
        task1Done = true;
        task1Button.disabled = false;
        task2Button.disabled = false;
      }
    }, 1000);
  });

  /*
   * TASK 2: abrir Discord y esperar 10 segundos.
   */
  task2Button.addEventListener("click", () => {
    if (!task1Done || task2Done) return;

    window.open(
      "https://discord.gg/jEQGF6zWS",
      "_blank",
      "noopener,noreferrer"
    );

    task2Button.disabled = true;
    let seconds = 10;

    timer2.textContent = "Espera " + seconds + " segundos...";

    task2Timer = setInterval(() => {
      seconds--;

      timer2.textContent = seconds > 0
        ? "Espera " + seconds + " segundos..."
        : "Pasos completados.";

      if (seconds <= 0) {
        clearInterval(task2Timer);
        task2Done = true;
        task2Button.disabled = false;

        // Después de completar los pasos, mostrar el Key System.
        navigate("generator");
      }
    }, 1000);
  });

  /*
   * AYUDA: abrir y cerrar la ventana emergente.
   */
  helpIcon.addEventListener("click", () => {
    helpOverlay.hidden = false;
  });

  closeHelp.addEventListener("click", () => {
    helpOverlay.hidden = true;
  });

  helpOverlay.addEventListener("click", event => {
    if (event.target === helpOverlay) {
      helpOverlay.hidden = true;
    }
  });

  /*
   * Generar una Key mediante el backend de Render.
   */
  generateButton.addEventListener("click", async () => {
    generateButton.disabled = true;
    copyButton.disabled = true;
    keyValue = "";
    keyOutput.textContent = "Generando...";
    expiryLabel.textContent = "";
    message.textContent = "";

    try {
      const response = await fetch(
        "https://glodon-key-system.onrender.com/api/keys/create",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({})
        }
      );

      const data = await response.json();

      if (!response.ok || !data.key) {
        throw new Error(
          data.error || "No se pudo generar la Key."
        );
      }

      const parsedExpiry = new Date(data.expiresAt).getTime();

      if (!Number.isFinite(parsedExpiry) || parsedExpiry <= Date.now()) {
        throw new Error("El servidor devolvió una fecha de expiración inválida.");
      }

      keyValue = String(data.key);
      expiryTime = parsedExpiry;

      keyOutput.textContent = keyValue;
      copyButton.disabled = false;
      message.textContent = "Key generada correctamente.";

      if (expiryInterval) {
        clearInterval(expiryInterval);
      }

      function updateExpiry() {
        const remaining = expiryTime - Date.now();

        if (remaining <= 0) {
          expiryLabel.textContent = "La Key ha expirado.";
          copyButton.disabled = true;
          clearInterval(expiryInterval);
          keyValue = "";
          return;
        }

        const hours = Math.floor(remaining / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);

        expiryLabel.textContent =
          "Expira en: " + hours + "h " +
          minutes + "m " + seconds + "s";
      }

      updateExpiry();
      expiryInterval = setInterval(updateExpiry, 1000);

    } catch (error) {
      keyOutput.textContent = "No se pudo generar la Key.";
      message.textContent =
        error.message ||
        "Comprueba tu conexión e inténtalo de nuevo.";
    } finally {
      generateButton.disabled = false;
    }
  });

  /*
   * Copiar la Key al portapapeles.
   */
  copyButton.addEventListener("click", async () => {
    message.textContent = "";

    if (!keyValue || Date.now() >= expiryTime) {
      message.textContent = "La Key no está disponible o ha expirado.";
      copyButton.disabled = true;
      return;
    }

    try {
      if (!navigator.clipboard || !navigator.clipboard.writeText) {
        throw new Error("Clipboard API no disponible.");
      }

      await navigator.clipboard.writeText(keyValue);
      message.textContent = "Key copiada correctamente.";

    } catch {
      const area = document.createElement("textarea");
      area.value = keyValue;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.left = "-9999px";
      area.style.top = "0";

      document.body.appendChild(area);
      area.select();
      area.setSelectionRange(0, area.value.length);

      let copied = false;

      try {
        copied = document.execCommand("copy");
      } catch {
        copied = false;
      }

      area.remove();

      message.textContent = copied
        ? "Key copiada correctamente."
        : "No se pudo copiar automáticamente. Mantén pulsada la Key para copiarla.";
    }
  });

  /*
   * Volver desde el Key System a la pantalla principal.
   */
  document.getElementById("generatorBack").addEventListener("click", () => {
    navigate("main");
  });

})();
</script>

</body>
</html>
